name: Update toolbox
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update toolbox and skills
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('index.html')
          s = p.read_text()
          marker = '''            <a class="tool-chip" href="https://opencode.ai/" target="_blank" rel="noreferrer" aria-label="OpenCode"><img src="https://opencode.ai/favicon.svg" alt="" width="42" height="42"><span>OpenCode</span></a>'''
          additions = '''
            <a class="tool-chip" href="https://claude.ai/" target="_blank" rel="noreferrer" aria-label="Claude"><img src="https://cdn.simpleicons.org/claude" alt="" width="42" height="42"><span>Claude</span></a>
            <a class="tool-chip" href="https://github.com/" target="_blank" rel="noreferrer" aria-label="GitHub"><img src="https://cdn.simpleicons.org/github" alt="" width="42" height="42"><span>GitHub</span></a>
            <a class="tool-chip" href="https://chatgpt.com/" target="_blank" rel="noreferrer" aria-label="ChatGPT"><img src="https://cdn.simpleicons.org/openai" alt="" width="42" height="42"><span>ChatGPT</span></a>
            <a class="tool-chip" href="https://www.linux.org/" target="_blank" rel="noreferrer" aria-label="Linux"><img src="https://cdn.simpleicons.org/linux" alt="" width="42" height="42"><span>Linux</span></a>'''
          if 'href="https://claude.ai/"' not in s:
              s = s.replace(marker, marker + additions)
              p.write_text(s)

          p = Path('skills.html')
          s = p.read_text()
          quick_marker = '''          <a href="https://opencode.ai/" target="_blank" rel="noreferrer" class="icon-card reveal" aria-label="OpenCode"><img src="https://opencode.ai/favicon.svg" alt="OpenCode" width="36" height="36"><span>OpenCode</span></a>'''
          quick_add = '''
          <a href="https://claude.ai/" target="_blank" rel="noreferrer" class="icon-card reveal" aria-label="Claude"><img src="https://cdn.simpleicons.org/claude" alt="Claude" width="36" height="36"><span>Claude</span></a>
          <a href="https://github.com/" target="_blank" rel="noreferrer" class="icon-card reveal" aria-label="GitHub"><img src="https://cdn.simpleicons.org/github" alt="GitHub" width="36" height="36"><span>GitHub</span></a>
          <a href="https://chatgpt.com/" target="_blank" rel="noreferrer" class="icon-card reveal" aria-label="ChatGPT"><img src="https://cdn.simpleicons.org/openai" alt="ChatGPT" width="36" height="36"><span>ChatGPT</span></a>
          <a href="https://www.linux.org/" target="_blank" rel="noreferrer" class="icon-card reveal" aria-label="Linux"><img src="https://cdn.simpleicons.org/linux" alt="Linux" width="36" height="36"><span>Linux</span></a>'''
          if 'href="https://claude.ai/"' not in s:
              s = s.replace(quick_marker, quick_marker + quick_add)

          section_marker = '''        <div class="section-head">
          <h2 data-i18n="skills.bp.lbl">Backend &amp; Platform</h2>'''
          tools_section = '''        <div class="section-head">
          <h2 data-i18n="skills.toolsai.lbl">Tools &amp; AI</h2>
          <span class="meta" data-i18n="skills.toolsai.sub">build, collaborate &amp; assist</span>
        </div>
        <div class="skill-grid">
          <a class="skill reveal" href="https://claude.ai/" target="_blank" rel="noreferrer" aria-label="Claude"><span class="ico"><img src="https://cdn.simpleicons.org/claude" alt="" width="22" height="22"></span><h3 data-i18n="skills.claude.title">Claude</h3><p data-i18n="skills.claude.desc">AI assistant for coding, analysis and writing.</p><span class="bar"><i style="width:78%"></i></span></a>
          <a class="skill reveal" href="https://github.com/" target="_blank" rel="noreferrer" aria-label="GitHub"><span class="ico"><img src="https://cdn.simpleicons.org/github" alt="" width="22" height="22"></span><h3 data-i18n="skills.github.title">GitHub</h3><p data-i18n="skills.github.desc">Code hosting, version control and collaboration.</p><span class="bar"><i style="width:86%"></i></span></a>
          <a class="skill reveal" href="https://chatgpt.com/" target="_blank" rel="noreferrer" aria-label="ChatGPT"><span class="ico"><img src="https://cdn.simpleicons.org/openai" alt="" width="22" height="22"></span><h3 data-i18n="skills.chatgpt.title">ChatGPT</h3><p data-i18n="skills.chatgpt.desc">AI assistant for research, debugging and ideation.</p><span class="bar"><i style="width:82%"></i></span></a>
          <a class="skill reveal" href="https://www.linux.org/" target="_blank" rel="noreferrer" aria-label="Linux"><span class="ico"><img src="https://cdn.simpleicons.org/linux" alt="" width="22" height="22"></span><h3 data-i18n="skills.linux.title">Linux</h3><p data-i18n="skills.linux.desc">Command-line environment, development and server workflows.</p><span class="bar"><i style="width:74%"></i></span></a>
        </div>

'''
          if 'data-i18n="skills.toolsai.lbl"' not in s:
              s = s.replace(section_marker, tools_section + section_marker)
          p.write_text(s)

          p = Path('assets/js/main.js')
          s = p.read_text()
          marker = "  'skills.oc.desc': { en:'AI coding agent for terminal workflows.', id:'AI coding agent untuk alur kerja coding di terminal.' },"
          trans = marker + "\n  'skills.toolsai.lbl': { en:'Tools & AI', id:'Tools & AI' },\n  'skills.toolsai.sub': { en:'build, collaborate & assist', id:'membangun, berkolaborasi & membantu' },\n  'skills.claude.title': { en:'Claude', id:'Claude' },\n  'skills.claude.desc': { en:'AI assistant for coding, analysis and writing.', id:'Asisten AI untuk coding, analisis, dan menulis.' },\n  'skills.github.title': { en:'GitHub', id:'GitHub' },\n  'skills.github.desc': { en:'Code hosting, version control and collaboration.', id:'Hosting kode, version control, dan kolaborasi.' },\n  'skills.chatgpt.title': { en:'ChatGPT', id:'ChatGPT' },\n  'skills.chatgpt.desc': { en:'AI assistant for research, debugging and ideation.', id:'Asisten AI untuk riset, debugging, dan mencari ide.' },\n  'skills.linux.title': { en:'Linux', id:'Linux' },\n  'skills.linux.desc': { en:'Command-line environment, development and server workflows.', id:'Lingkungan command-line, development, dan workflow server.' },"
          if "'skills.toolsai.lbl'" not in s:
              s = s.replace(marker, trans)
          p.write_text(s)

          Path('.github/workflows/update-toolbox.yml').unlink(missing_ok=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','feat: expand toolbox with AI and Linux tools'], check=True)
          subprocess.run(['git','push'], check=True)
